name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages. In the repository settings, set
# Pages > Source to "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # The app is served from https://simple-api-dev.github.io/auth-client/
      # SIMPLEAPI_KEY is a repository VARIABLE (Settings > Secrets and
      # variables > Actions > Variables). Whatever is passed with
      # --dart-define is compiled into the public JavaScript, so it must be a
      # dedicated throwaway demo key. If the variable is not set the site
      # builds in "no key" mode and makes no API calls.
      - run: >
          flutter build web --release --base-href /auth-client/
          --dart-define=SIMPLEAPI_KEY=${{ vars.SIMPLEAPI_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
